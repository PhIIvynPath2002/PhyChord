<script>
'use strict';
// All analysis is local. Modules: Harmony, ChordRecognition, Tonality, NonChord,
// MIDIInput and UI. Pitch classes do not preserve enharmonic spelling.
const NAMES=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const pc=n=>((n%12)+12)%12;
const keyName=k=>NAMES[k.tonic]+' '+(k.mode==='major'?'大调':'小调');
const Templates=[
 ['maj','大三',[0,4,7]],['min','小三',[0,3,7]],['dim','减三',[0,3,6]],['aug','增三',[0,4,8]],
 ['maj7','大七',[0,4,7,11]],['min7','小七',[0,3,7,10]],['dom7','属七',[0,4,7,10]],['half','半减七',[0,3,6,10]],['dim7','减七',[0,3,6,9]],
 ['maj9','大九',[0,4,7,11,2]],['min9','小九',[0,3,7,10,2]],['dom9','属九',[0,4,7,10,2]],
 ['sus4','挂四',[0,5,7]],['sus2','挂二',[0,2,7]],['six','大六',[0,4,7,9]],['min6','小六',[0,3,7,9]]
].map(([id,name,intervals])=>({id,name,intervals}));
const State={mode:'chord',selected:{tonic:0,mode:'major'},chord:null,previous:null,notes:[],history:[],pending:null,lastSignature:'',lastChange:0};
const Harmony=(()=>{
 // Sposobin: I=T, II=SII, III=DTIII, IV=S, V=D, VI=TSVI, VII=DVII.
 // Natural minor: III is major, VI major, VII natural major (subtonic, not DVII).
 // Harmonic minor additionally supplies major V/D7 and raised leading-tone DVII/VII7.
 const tables={major:[[0,'maj','T'],[2,'min','SII'],[4,'min','DTIII'],[5,'maj','S'],[7,'maj','D'],[9,'min','TSVI'],[11,'dim','DVII'],[0,'maj7','T7'],[2,'min7','II7'],[4,'min7','III7'],[5,'maj7','S7'],[7,'dom7','D7'],[9,'min7','VI7'],[11,'half','VII7'],[11,'dim7','VII7'],[7,'dom9','D9']],minor:[[0,'min','T'],[2,'dim','SII'],[3,'maj','DTIII'],[5,'min','S'],[7,'maj','D'],[7,'min','D（自然小调）'],[8,'maj','TSVI'],[11,'dim','DVII'],[10,'maj','VII（自然音级）'],[0,'min7','T7'],[2,'half','II7'],[3,'maj7','III7'],[5,'min7','S7'],[7,'dom7','D7'],[7,'min7','V7（自然小调）'],[8,'maj7','VI7'],[11,'dim7','VII7'],[10,'dom7','VII7（自然音级）'],[7,'dom9','D9']]};
 // Neapolitan chord (那不勒斯和弦): minor ♭II–IV–VI = [1,5,8]
 // relative to tonic, a major triad on ♭II with subdominant function.
 // N, N6 (usual Neapolitan sixth), N64 distinguish its actual inversion.
 function isNeapolitan(c,k){return !!(c&&k&&k.mode==='minor'&&pc(c.root-k.tonic)===1&&c.type.id==='maj')}
 function base(c,k){if(isNeapolitan(c,k))return 'N';return tables[k.mode].find(r=>r[0]===pc(c.root-k.tonic)&&r[1]===c.type.id)?.[2]||null}
 function label(c,k,context={}){let b=base(c,k);if(!b)return null;
 if(c.type.intervals.length===3){if(c.inversion===1)b+='6';if(c.inversion===2){if(b==='T'&&context.cadential)b='K64';else b+='64'}}
 else if(c.type.intervals.length===4&&['maj7','min7','dom7','half','dim7'].includes(c.type.id)&&c.inversion>0){b=b.replace('7',['','65','43','2'][c.inversion])}
 else if(c.inversion>0)b+=' / '+NAMES[c.bass];return b}
 function relation(k,other){const d=pc(other.tonic-k.tonic),same=other.mode===k.mode;
 if(same&&d===7)return [0,'属调'];if(same&&d===5)return [1,'下属调'];
 if(!same&&d===(k.mode==='major'?9:3))return [2,'平行调（关系大小调）'];if(!same&&d===0)return [3,'同名调'];
 if(other.mode==='minor'&&d===7)return [4,'属小调'];if(other.mode==='minor'&&d===5)return [5,'下属小调'];
 let fifth=0;while(pc(fifth*7)!==d)fifth++;return [6+Math.min(fifth,12-fifth)+(same?0:1),'其他调']}
 function alternatives(c,k){return Tonality.keys.filter(o=>o.tonic!==k.tonic||o.mode!==k.mode).map(o=>({key:o,label:label(c,o),rel:relation(k,o)})).filter(o=>o.label).sort((a,b)=>a.rel[0]-b.rel[0]||a.key.tonic-b.key.tonic)}
 return {base,label,alternatives,isNeapolitan};
})();
const ChordRecognition={
 basic(notes,key,previous){const pitches=[...new Set(notes.map(pc))];if(pitches.length<3)return null;const bass=Math.min(...notes);let candidates=[];
 for(let root=0;root<12;root++)for(const type of Templates){const tones=type.intervals.map(i=>pc(root+i));if(!tones.every(n=>pitches.includes(n)))continue;
 const outside=pitches.filter(n=>!tones.includes(n));const inversion=type.intervals.indexOf(pc(bass-root));const c={root,type,tones,outside,bass:pc(bass),inversion};
 // Complete triads/sevenths take priority; a complete ninth beats a subset with
 // discarded tones. For ambiguous subsets prefer continuity, in-key fit and bass.
 c.score=outside.length*12+(inversion<0?3:0)+(type.intervals.length>4?1:0)+(type.id.startsWith('sus')?2:0);
 if(key&&Harmony.base(c,key))c.score-=2;if(previous&&previous.root===root&&previous.type.id===type.id)c.score-=1;
 candidates.push(c)}
 candidates.sort((a,b)=>a.score-b.score||a.root-b.root);return candidates[0]||null},
 recognize(notes,key,previous){const basic=this.basic(notes,key,previous);if(!key)return basic;
 const candidate=Classical.analyze(notes,key).find(x=>x.id!=='diatonic'&&x.confidence>=.5);
 if(candidate&&(!basic||basic.outside.length)){const root=candidate.root??key.tonic,tones=[...new Set(notes.map(pc))];return {root,type:{id:'special',name:Classical.acoustic(notes),intervals:tones.map(n=>pc(n-root))},tones,outside:[],bass:pc(Math.min(...notes)),inversion:0,special:true}}
 return basic}
};
// Classical analysis is separate from acoustic template recognition. Confidence
// is a heuristic evidence score, NOT a calibrated probability. Never infer a
// historical name from pitch-class identity alone when spelling/context differs.
const Spelling=(()=>{
 const letters=['C','D','E','F','G','A','B'],natural=[0,2,4,5,7,9,11];
 const tonics=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
 function pitch(name){const m=/^([A-Ga-g])([#b♯♭]{0,2})$/.exec(name);if(!m)return null;return pc(natural[letters.indexOf(m[1].toUpperCase())]+[...m[2]].reduce((s,c)=>s+(c==='#'||c==='♯'?1:-1),0))}
 function degree(key,degree,offset){const tonic=key.spelling||tonics[key.tonic],i=letters.indexOf(tonic[0]),target=pc(key.tonic+offset),li=(i+degree-1)%7;let d=pc(target-natural[li]);if(d>6)d-=12;return letters[li]+(d>0?'♯'.repeat(d):'♭'.repeat(-d))}
 function auto(key){const result={};const scale=key.mode==='major'?[0,2,4,5,7,9,11]:[0,2,3,5,7,8,10];scale.forEach((x,i)=>result[pc(key.tonic+x)]=degree(key,i+1,x));return result}

 const chosen=candidates[0];$('classicalDetails').replaceChildren();$('classicalCandidates').replaceChildren();
 if(chosen){const spelling={...Spelling.auto(key),...chosen.spelling,...correction.map};
 const rows=[['分析状态',Math.round(chosen.confidence*100)+'%（启发式证据分数）'+(candidates[1]&&chosen.confidence-candidates[1].confidence<.15?' · 多种解释接近，暂不唯一确定':'' )],['和弦名称',chosen.name+(chosen.id!=='diatonic'&&chosen.id!=='N'?'（功能候选，待上下文确认）':'')],['英文名称',chosen.en],['音响结构',Classical.acoustic(State.notes)],['功能标记',chosen.label+' / '+chosen.roman],['调性',Spelling.tonics[key.tonic]+' '+key.mode],['构成音',[...new Set([...State.notes].sort((a,b)=>a-b).map(pc))].map(n=>spelling[n]||NAMES[n]).join('–')],['和声功能',chosen.function],['转位 / 低音',chosen.inversion||'按实际低音'],['典型解决',chosen.resolution]];
 for(const [name,value] of rows){const div=document.createElement('div');div.textContent=name+'：'+value;$('classicalDetails').append(div)}
 if(chosen.id!=='diatonic'){$('chord').textContent=chosen.name;
 const contextRequired=chosen.id!=='N';$('function').textContent=chosen.label+' / '+chosen.roman+(contextRequired?'（候选）':'');}
 if(play&&candidates.filter(x=>x.confidence>=.5).length>1)$('function').textContent+=' · 多解';
 for(const x of candidates){const li=document.createElement('li');li.textContent=x.label+' / '+x.roman+' · '+x.name+' · '+Math.round(x.confidence*100)+'%（启发式） · '+x.evidence.join('；');$('classicalCandidates').append(li)}}
 const popSpelling={...(key?Spelling.auto(key):{}),...(chosen?.spelling||{}),...correction.map};
 const pop=PopHarmony.analyze(State.notes,key,popSpelling),functional=PopHarmony.useFunctional(candidates,c);
 $('popSymbol').textContent=functional?pop.text:'';
 if(pop.text&&!functional){$('function').textContent=pop.text;$('chord').textContent='';$('inversion').textContent=''}
 $('popSymbol').hidden=!functional;
 $('liveStaff').innerHTML=Notation.svg([{notes:State.notes.map(n=>Notation.fromMidi(n,popSpelling)),beats:1}],{live:true,width:300,key});
 $('contextFindings').textContent=ContextHarmony.findings.map(x=>x.name+' · '+Math.round(x.confidence*100)+'%：'+x.reason).join('；');
 $('alternatives').replaceChildren();if(!play&&c)for(const a of Harmony.alternatives(c,key)){const li=document.createElement('li');li.textContent=a.rel[1]+' · '+keyName(a.key)+'：'+a.label;$('alternatives').append(li)}
 const out=c?NonChord.analyze(c,State.notes,performance.now()):[];$('outside').textContent=out.length?'和弦外音：'+out.join('，'):'';
 $('notes').textContent=State.notes.length?'按下音符：'+State.notes.map(n=>NAMES[pc(n)]+(Math.floor(n/12)-1)).join(', '):'';$('history').textContent=play?'最近和声：'+(State.history.join(' → ')||'—'):'';
 document.querySelectorAll('#keyboard button').forEach(b=>{b.disabled=play;b.classList.toggle('active',State.notes.includes(Number(b.dataset.note)))})}
 return {schedule(){if(!queued){queued=true;requestAnimationFrame(render)}}};
})();
NAMES.forEach((name,i)=>{const o=document.createElement('option');o.value=i;o.textContent=name;document.querySelector('#tonic').append(o)});
let whiteKeyIndex=0;
for(let n=21;n<=108;n++){
 const b=document.createElement('button'),black=[1,3,6,8,10].includes(pc(n));b.dataset.note=n;
 // 52 white keys span the container; black keys overlap their shared borders.
 // Accessible labels remain available without visible note-name markings.
 if(black){b.className='black';b.style.left=((whiteKeyIndex-.325)*100/52)+'%';b.style.width=(.65*100/52)+'%'}
 else{b.style.left=(whiteKeyIndex*100/52)+'%';b.style.width=(100/52)+'%';whiteKeyIndex++}
 b.setAttribute('aria-label','切换音符 '+NAMES[pc(n)]+(Math.floor(n/12)-1));
 b.onclick=()=>{if(State.mode!=='play')MIDIInput.event(State.notes.includes(n)?'noteoff':'noteon',n,90)};document.querySelector('#keyboard').append(b)
}
document.querySelector('#connect').onclick=MIDIInput.connect;
document.querySelector('#mode').onchange=e=>{State.mode=e.target.value;Analysis.reset()};
document.querySelector('#spelling').oninput=()=>UI.schedule();
for(const id of ['tonic','quality'])document.getElementById(id).onchange=()=>{State.selected={tonic:Number(document.querySelector('#tonic').value),mode:document.querySelector('#quality').value};NonChord.reset();ContextHarmony.reset();State.lastSignature='';UI.schedule()};
document.querySelector('#reset').onclick=()=>Analysis.reset();UI.schedule();
if(typeof window!=='undefined'){for(const b of document.querySelectorAll('#keyboard button')){const copy=b.cloneNode(true);copy.onclick=()=>{if(State.mode==='play')return;const n=Number(copy.dataset.note);MIDIInput.event(State.notes.includes(n)?'noteoff':'noteon',n,90)};document.getElementById('scoreKeyboard').append(copy)}ScoreEditor.bind();Settings.bind();PianoAudio.bind();}
</script></body></html>
