name: PhyChord 1.1 release
on:
  push:
    tags: ['v1.1.0']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: windows-latest
            platform: win
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/classical.test.cjs && node tests/score.test.cjs && node tests/pivot.test.cjs && node tests/engraving.test.cjs && node tests/audio.test.cjs && node tests/piano.test.cjs && node tests/pop.test.cjs && node tests/desktop-security.test.cjs
      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build macOS installer
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: PhyChord1.1-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums and standalone HTML
        run: |
          cp index.html release-assets/PhyChord1.1.html
          cd release-assets
          sha256sum *.exe *.dmg *.zip *.html > SHA256SUMS.txt
      - name: Publish PhyChord1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.1.0 release-assets/* --verify-tag --title PhyChord1.1 --notes-file RELEASE_NOTES.md
