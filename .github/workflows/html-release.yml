name: PhyChord 2.2.3 offline HTML
on:
  push:
    tags: ['v2.2.3']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  html-release:
    if: github.ref == 'refs/tags/v2.2.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish standalone HTML only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="application-version" content="2.2.3"' index.html
          cp index.html PhyChord2.2.3.html
          if gh release view v2.2.3 >/dev/null 2>&1; then
            gh release upload v2.2.3 PhyChord2.2.3.html --clobber
            gh release edit v2.2.3 --title PhyChord2.2.3 --notes-file RELEASE_NOTES.md
          else
            gh release create v2.2.3 PhyChord2.2.3.html --verify-tag --title PhyChord2.2.3 --notes-file RELEASE_NOTES.md
          fi
